<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>Every Picture V2</title>
</head>
<body>

<h1 class="page-title">Small Things, Meaningful Memories</h1>

<div class="shelf">
<img src="images/nyota.png" alt="nyota" class="nyota"
data-title="Unknown Road Nyota"
data-story="This was a figure that a cousin gifted me during my junior year of college, a time when I was having difficulties with deciding what I wanted to do with my career after graduation. I was feeling extremely overwhelmed. After receiving her, I discovered that her character is a gentle girl who’s always moved by simple pleasures in life. It was a gentle reminder for me to take things slow and enjoy everyday moments in my own life instead of stressing. It was kind of what I needed at the time and showed me that everyone's journey in life will be different and continuing to discover things that you might like in the future is okay.">

<img src="images/calicocritter.png" alt="calico critter" class="calicocritter"
data-title="Very Berry Calico Critter"
data-story="A childhood toy of mine that is currently making a strong comeback and trending everywhere. I grew up as an only child so I spent a lot of time playing toys with my cousins. In a way, they became my siblings. I miss being a carefree child who did not have to worry about adult responsibilities.">

<img src="images/kirby.png" alt="kirby" class="kirby"
data-title="Dream Land Kirby"
data-story="Last year during Picnic Day, my older cousins and friends came up to spend they day with me. I had not seen them in a while so I had a great time catching up with them. I used to spend a lot of time with them when they attended UC Davis, so memories from the moments definitely came back to me. We walked around downtown and bought a few things together. Kirby was one of our favorite characters ever so I wanted it as a memory of that day.">

<img src="images/smiski.png" alt="smiski" class="smiski"
data-title="Yoga Smiski"
data-story="Smiskis are something that my friends, family, and I bond over. I love collecting and trading with them whenever we have duplicates. It is just something silly and fun that we obsess over. I remember one of my cousin's buying me a bunch for Christmas because I love them so much.">

<img src="images/cat.png" alt="cat" class="cat"
data-title="Taiyaki Cat"
data-story="I bought this a souvenir from a family trip to Hawaii. It was from a gift shop at a beautiful Japanese temple close to the mountains. The beaches were amazing and my family and I got to experience a nice hot summer day there. I hadn't felt relaxed in a long time, so it was nice to unwind and wander around.">
</div>

<div class="overlay hidden">
  <div class="overlay-content">
    <h2 class="story-title"></h2>
    <p class="story-text"></p>
    <button class="close">close</button>
  </div>
</div>

</body>
</html>
