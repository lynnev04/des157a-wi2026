<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mad Libs</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
</head>
<body>

  <main>
    <section>  
      <article>
        <h1>A Galactic Adventure</h1>

        <form>

          <label for="noun">Noun:</label>
          <input type="text" name=noun id="noun" required>

          <label for="verb">Verb:</label>
          <input type="text" name=verb id="verb" required>

          <label for="adjective">Adjective:</label>
          <input type="text" name=adjective id="adjective" required>

          <label for="noun">Noun:</label>
          <input type="text" name=noun2 id="noun2" required>

          <label for="emotion">Emotion:</label>
          <input type="text" name=emotion id="emotion" required>

          <input type="submit" value="Create Story">

        </form>

        <p id="story"></p>
      </article>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
