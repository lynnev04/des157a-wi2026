<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mad Libs</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
</head>
<body>

  <main> 
      <article>
        <h1>A Galactic Adventure</h1>
        <form>

          <label for="noun1">Noun:</label>
          <input type="text" name=noun1 id="noun1" required>

          <label for="adjective1">Adjective:</label>
          <input type="text" name=adjective1 id="adjective1" required>

          <label for="noun2">Noun:</label>
          <input type="text" name=noun2 id="noun2" required>

          <label for="verb">Verb:</label>
          <input type="text" name=verb id="verb" required>

          <label for="exclamation">Exclamation:</label>
          <input type="text" name=exclamation id="exclamation" required>

          <label for="adjective2">Adjective:</label>
          <input type="text" name=adjective2 id="adjective2" required>

          <input type="submit" value="Create Story">

        </form>

        
      </article>
  </main>
  <div class="overlay">
    <div class="overlay-content">
      <h2>Your Galactic Adventure</h2>
      <p>Your galactic adventure will appear here after you submit!</p>
    </div>
  </div>
</body>
</html>
